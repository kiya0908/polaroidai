version: '3.1'
services:
  nextjs-learn-domes:
    image: postgres:15
    volumes:
      - ./postgres:/var/lib/postgresql/data
    ports:
      - 5433:5432
    environment:
      - POSTGRES_USER=local_user
      - POSTGRES_PASSWORD=local_password_123

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080
